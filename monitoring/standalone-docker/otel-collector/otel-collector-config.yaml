receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Forward traces to Jaeger via OTLP (Jaeger's all-in-one image accepts OTLP natively)
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Expose received metrics on :8889 for Prometheus to scrape
  prometheus:
    endpoint: 0.0.0.0:8889

  # The collector's own internal metrics are exposed automatically on :8888
  # via the built-in telemetry.metrics setting below.

  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
